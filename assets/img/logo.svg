<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 76" width="268" height="76" role="img" aria-label="DLAS Holdings Corp">
  <!-- Standalone wordmark for external use (email signatures, print, social).
       The site header renders the same wordmark as live HTML text so it stays
       crisp and selectable — see .brand in assets/css/styles.css. -->
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@700&amp;display=swap");
      .wordmark { font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: 0.5px; fill: #0A1F44; }
      .sub { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-weight: 500; font-size: 11px; letter-spacing: 4.6px; fill: #5B6B82; }
    </style>
  </defs>
  <text class="wordmark" x="2" y="46">DLAS<tspan dx="4" fill="#06B6D4" font-size="34">&#8226;</tspan></text>
  <text class="sub" x="3" y="68">HOLDINGS CORP</text>
</svg>
