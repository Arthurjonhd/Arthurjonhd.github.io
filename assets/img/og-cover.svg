<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="DLAS Holdings Corp — IT and technology services, patient coordination, and design in Miami and South Florida">
  <!-- Source for assets/img/og-cover.png (the file referenced by og:image).
       Regenerate the PNG after editing — see CLAUDE.md, "Social share image". -->
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@700&amp;display=swap");
      .wordmark { font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif; font-weight: 700; font-size: 116px; letter-spacing: -1px; fill: #FFFFFF; }
      .sub { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-weight: 500; font-size: 22px; letter-spacing: 9px; fill: #9FB0CC; }
      .tagline { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-weight: 400; font-size: 34px; fill: #DDE5F2; }
      .meta { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-weight: 500; font-size: 20px; letter-spacing: 3px; fill: #06B6D4; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0A1F44"/>

  <!-- Topology motif, kept faint so the type carries the image. -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2">
    <path d="M812 96 940 168 1082 104"/>
    <path d="M940 168 880 262"/>
    <path d="M1082 104 1128 250"/>
    <path d="M880 262 1030 300 1128 250"/>
    <path d="M880 262 770 380 924 442 1030 300"/>
    <path d="M924 442 1068 434 1150 360"/>
    <path d="M1030 300 1068 434"/>
    <path d="M812 96 700 210 880 262"/>
  </g>
  <g fill="#06B6D4" fill-opacity="0.75">
    <circle cx="812" cy="96" r="5"/>
    <circle cx="1082" cy="104" r="5"/>
    <circle cx="1128" cy="250" r="5"/>
    <circle cx="770" cy="380" r="5"/>
    <circle cx="1068" cy="434" r="5"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.5">
    <circle cx="940" cy="168" r="3.5"/>
    <circle cx="1030" cy="300" r="3.5"/>
    <circle cx="924" cy="442" r="3.5"/>
    <circle cx="700" cy="210" r="3.5"/>
    <circle cx="1150" cy="360" r="3.5"/>
  </g>
  <g fill="none" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1.2">
    <circle cx="880" cy="262" r="12"/>
    <circle cx="880" cy="262" r="24"/>
  </g>
  <circle cx="880" cy="262" r="6" fill="#06B6D4"/>

  <text class="wordmark" x="88" y="300">DLAS<tspan dx="10" fill="#06B6D4" font-size="86">&#8226;</tspan></text>
  <text class="sub" x="92" y="348">HOLDINGS CORP</text>
  <text class="tagline" x="88" y="446">IT &amp; Technology · Patient Coordination · Design</text>
  <text class="meta" x="88" y="512">MIAMI &amp; SOUTH FLORIDA · REMOTE AVAILABLE</text>

  <rect x="0" y="614" width="1200" height="16" fill="#1D4ED8"/>
